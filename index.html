<style>
:root{
  color-scheme:light;
  --bg:#F2F5EE; --card:#FFFFFF; --ink:#17251C; --muted:#5B6A60; --line:#D9E1D3; --soft:#E7EDE2;
  --pri:#134E35; --on-pri:#FFFFFF; --pri-text:#134E35; --malam:#0D3323;
  --padi:#E3A82B; --padi-soft:#FBF0D6; --padi-ink:#6B4A06;
  --tanah:#8A5A34; --merah:#B42318; --merah-soft:#FDECEA; --hijau-soft:#E2F2E8;
  --shadow:0 1px 0 rgba(19,78,53,.06), 0 8px 24px -16px rgba(13,51,35,.35);
  --r-l:22px; --r-m:14px; --r-s:10px;
  --head:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0E1813; --card:#16231C; --ink:#E6EEE8; --muted:#9BAEA2; --line:#273A2F; --soft:#1C2C23;
    --pri:#2C8A5A; --on-pri:#FFFFFF; --pri-text:#7FD3A4; --malam:#0A2318;
    --padi:#E8B13E; --padi-soft:#3A2E12; --padi-ink:#F6D58C;
    --tanah:#D3A07A; --merah:#F2867A; --merah-soft:#3A1C19; --hijau-soft:#173226;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -18px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
@media (min-width:860px){body{padding-bottom:0}}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);letter-spacing:-.02em;margin:0;line-height:1.1}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:15px;font-weight:600;font-family:var(--body);letter-spacing:0;line-height:1.3}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--padi);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* draf bar */
.draft{background:var(--padi-soft);color:var(--padi-ink);font-size:13px}
.draft .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-top:7px;padding-bottom:7px}
.draft select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:13px}
@media (max-width:600px){.draft .dlong{display:none}.draft .wrap{flex-wrap:nowrap}.draft label{flex:1;min-width:0}.draft select{width:100%}}
.draft button{background:none;border:0;text-decoration:underline;cursor:pointer;color:inherit;font-size:13px;padding:0}

/* header */
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:64px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--padi)}
.brand b{font-family:var(--head);font-size:18px;font-weight:800;color:var(--pri-text);display:none}
@media (min-width:640px){.brand b{display:block}}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 12px 0 38px;font-size:15px}
.search input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 15%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}
.navlinks{display:none;gap:2px}
@media (min-width:860px){.navlinks{display:flex}}
.navlinks a{padding:8px 11px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.navlinks a.on,.navlinks a:hover{background:var(--soft);color:var(--ink)}
.ibtn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:none;cursor:pointer;font-size:20px;flex-shrink:0}
.ibtn:hover{background:var(--soft)}
.badge{position:absolute;top:3px;right:2px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--padi);color:#2B1D00;font-size:11px;font-weight:700;display:grid;place-items:center}
.badge.red{background:var(--merah);color:#fff}
details.pop{position:relative}
details.pop>summary{list-style:none}
details.pop>summary::-webkit-details-marker{display:none}
.popbox{position:absolute;right:0;top:50px;width:min(92vw,360px);background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 20px 50px -20px rgba(0,0,0,.4);overflow:hidden;z-index:60}
.popbox .list{max-height:60vh;overflow:auto}
.popbox .item{padding:12px 14px;border-top:1px solid var(--line);display:block}
.popbox .item.unread{background:var(--padi-soft)}
.popbox .menu a,.popbox .menu button{display:block;width:100%;text-align:left;padding:12px 14px;border:0;background:none;border-top:1px solid var(--line);cursor:pointer;font-weight:600;font-size:14px}
.popbox .menu a:hover,.popbox .menu button:hover{background:var(--soft)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;font-weight:700}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:860px){nav.bottom{display:none}}
nav.bottom a{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted)}
nav.bottom a span{font-size:20px;line-height:1}
nav.bottom a.on{color:var(--pri-text)}

/* tombol & form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--pri);color:var(--on-pri);font-weight:700;cursor:pointer;font-size:15px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.gold{background:var(--padi);color:#2B1D00}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--card);color:var(--merah);border-color:var(--line)}
.btn.sm{height:38px;padding:0 13px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;height:46px;margin-top:5px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:15px}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.in:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 14%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* blok umum */
main{min-height:70vh}
.section{padding-top:34px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:20px}
.dark{background:var(--malam);color:#E9F2EC;border-radius:var(--r-l);padding:24px;position:relative;overflow:hidden}
.dark .muted{color:#A9C2B4}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-l);padding:34px 18px;text-align:center}
.empty b{display:block;font-size:17px;margin-bottom:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:40px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.chip.sm{height:34px;font-size:13px;border-radius:9px;padding:0 12px}
.chip.sm.on{background:var(--padi);border-color:var(--padi);color:#2B1D00}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.tabs a{padding:9px 14px;border-radius:9px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.tabs a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--soft);white-space:nowrap}
.st-wait{background:var(--padi-soft);color:var(--padi-ink)} .st-go{background:#E4ECFB;color:#1E3A8A} .st-ok{background:var(--hijau-soft);color:var(--pri-text)} .st-no{background:var(--merah-soft);color:var(--merah)}
@media (prefers-color-scheme:dark){.st-go{background:#1B2744;color:#AFC6FF}}
.r-petani{background:#DDF3E6;color:#0F5132}.r-tengkulak{background:#FBEBC8;color:#7A4B00}.r-pedagang{background:#DFE9FB;color:#1E3A8A}.r-konsumen{background:#ECE3FA;color:#4C1D95}.r-masyarakat{background:#D9F2EF;color:#115E59}.r-ekspedisi{background:#FCE3D3;color:#9A3412}
.toastbox{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9999;display:grid;gap:8px;width:min(92vw,420px)}
.toast{background:var(--malam);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);animation:tin .25s ease-out}
.toast.err{background:var(--merah)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* hero + papan harga */
.hero{background:var(--malam);color:#EEF5F0;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(115deg,rgba(227,168,43,.07) 0 2px,transparent 2px 22px),
  radial-gradient(120% 90% at 100% 0%,rgba(227,168,43,.22),transparent 55%);pointer-events:none}
.hero .wrap{position:relative;display:grid;gap:28px;padding-top:40px;padding-bottom:40px}
@media (min-width:900px){.hero .wrap{grid-template-columns:1.05fr 1fr;align-items:center;padding-top:60px;padding-bottom:60px}}
.hero h1{font-size:clamp(34px,6vw,62px);line-height:.98;letter-spacing:-.035em;max-width:13ch}
.hero p.lead{margin-top:16px;font-size:17px;color:#BFD3C6;max-width:46ch}
.hero .cta{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.board{background:#0A2619;border:1px solid rgba(227,168,43,.35);border-radius:18px;padding:18px 18px 12px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.02),0 30px 60px -30px rgba(0,0,0,.7)}
.board .bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px dashed rgba(227,168,43,.35);padding-bottom:10px}
.board .bh b{font-family:var(--head);font-size:20px;color:#F4D58A}
.board .bh span{font-size:12px;color:#93AFA0}
.brow{display:grid;grid-template-columns:1fr auto 62px;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
.brow:last-child{border-bottom:0}
.brow .nm{font-weight:600;color:#E7F0EA}
.brow .nm small{display:block;font-weight:400;color:#87A595;font-size:12px}
.brow .pr{font-family:var(--head);font-size:22px;font-weight:800;color:#F7C95B;font-variant-numeric:tabular-nums}
.brow .ch{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.up{color:#7EDC9F}.down{color:#FF9C8F}
.board .bf{display:flex;justify-content:space-between;padding-top:10px;font-size:12px;color:#93AFA0}
.board .bf a{color:#F4D58A;font-weight:600}
.flip{animation:flip .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{from{opacity:0;transform:rotateX(70deg)}to{opacity:1;transform:none}}

/* produk */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.pgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.pcard:hover{border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}
.pimg{aspect-ratio:1;width:100%;object-fit:cover;background:var(--soft)}
.ph{display:grid;place-items:center;font-size:56px;background:linear-gradient(160deg,hsl(var(--h,120) 45% 88%),hsl(var(--h,120) 40% 76%))}
@media (prefers-color-scheme:dark){.ph{background:linear-gradient(160deg,hsl(var(--h,120) 25% 22%),hsl(var(--h,120) 25% 15%))}}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.pbody h3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.price{font-family:var(--head);font-weight:800;color:var(--pri-text);font-size:17px;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:12px}
.pmeta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.pcat{font-size:12px;color:var(--tanah);font-weight:600}
.grosir{align-self:flex-start;margin-top:4px;background:var(--padi-soft);color:var(--padi-ink);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (min-width:760px){.cats{grid-template-columns:repeat(8,minmax(0,1fr))}}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 10px;text-align:center;font-size:13px;font-weight:600;line-height:1.25}
.cat span{display:block;font-size:28px;margin-bottom:6px}
.cat.gold{background:var(--padi-soft);border-color:color-mix(in srgb,var(--padi) 50%,var(--line))}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.qty button{width:44px;height:44px;border:0;background:none;cursor:pointer;font-size:20px}
.qty input{width:56px;text-align:center;border:0;background:none;height:44px;font-variant-numeric:tabular-nums}
.note{border-radius:12px;padding:11px 13px;font-size:14px;background:var(--padi-soft);color:var(--padi-ink)}
.note.green{background:var(--hijau-soft);color:var(--pri-text)}
.split{display:grid;gap:22px}
@media (min-width:860px){.split{grid-template-columns:1.35fr 1fr;align-items:start}.split.even{grid-template-columns:1fr 1fr}}
.sticky{position:sticky;top:80px}
.lineitem{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:10px}
.lineitem .thumb{width:68px;height:68px;border-radius:10px;object-fit:cover;flex-shrink:0;font-size:30px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;cursor:pointer}
.opt.on{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .tot{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.steps{display:flex;gap:4px;overflow-x:auto}
.steps div{flex:1;min-width:70px;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.steps i{display:block;height:6px;border-radius:9px;background:var(--soft);margin-bottom:6px}
.steps .done{color:var(--pri-text)} .steps .done i{background:var(--pri)}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:4px 0 10px}
.tl li::before{content:"";position:absolute;left:-23px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 3px var(--card)}
.orow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.orow:hover{border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}
.stars{color:var(--padi);letter-spacing:1px}
.starpick button{background:none;border:0;font-size:28px;cursor:pointer;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--padi)}
/* lelang */
.hgrid{display:grid;gap:14px}
@media (min-width:700px){.hgrid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1050px){.hgrid{grid-template-columns:repeat(3,1fr)}}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.hcard .top{padding:18px 18px 0;display:flex;gap:14px;align-items:center}
.hcard .em{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;background:var(--padi-soft);flex-shrink:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px}
.duo div{background:var(--soft);border-radius:12px;padding:9px 11px}
.duo div.hi{background:var(--padi-soft);color:var(--padi-ink)}
.duo small{display:block;font-size:12px;opacity:.8}
.duo b{font-family:var(--head);font-size:17px;font-variant-numeric:tabular-nums}
.offer{background:var(--soft);border-radius:12px;padding:11px 13px}
/* chat */
.chat{display:grid;gap:14px;height:calc(100dvh - 64px - 62px - 28px - env(safe-area-inset-bottom,0px));min-height:440px}
@media (min-width:860px){.chat{grid-template-columns:300px 1fr;height:calc(100dvh - 64px - 40px)}}
.clist,.cbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.clist .c{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.clist .c.on{background:var(--soft)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.bub{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:15px;align-self:flex-start;border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--pri);color:var(--on-pri);border-color:var(--pri);border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.bub time{display:block;font-size:11px;opacity:.65;margin-top:2px}
.bub .tw{display:inline-block;background:var(--padi);color:#2B1D00;border-radius:8px;padding:1px 8px;font-weight:700;font-size:13px;margin-bottom:3px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}
@media (max-width:859px){.chat.open .clist{display:none}.chat:not(.open) .cbox{display:none}}
/* peta */
.map{height:58vh;min-height:340px;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);background:var(--soft);position:relative;z-index:0}
.map.small{height:260px;min-height:0}
.leaflet-container{font:inherit}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.3);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-size:15px}
/* dialog */
dialog{border:0;border-radius:var(--r-l);padding:0;width:min(560px,94vw);max-height:90dvh;background:var(--card);color:var(--ink);box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(8,20,14,.55)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
dialog .db{padding:18px}
.upbox{display:flex;gap:12px;align-items:center}
.upbox .prev{width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--soft);font-size:26px;cursor:pointer;flex-shrink:0}
.upbox .prev img{width:100%;height:100%;object-fit:cover}
footer.foot{margin-top:56px;background:var(--malam);color:#B6CBBE;font-size:14px}
footer.foot .wrap{display:grid;gap:18px;padding-top:30px;padding-bottom:30px}
@media (min-width:760px){footer.foot .wrap{grid-template-columns:1.4fr 1fr 1fr}}
footer.foot b{color:#fff}
.chart{width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);cursor:pointer}
.prow.on{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 15%,transparent)}
.rolepick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.rolepick{grid-template-columns:repeat(3,1fr)}}
.rolepick button{text-align:left;padding:11px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);cursor:pointer}
.rolepick button.on{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.wa{display:inline-flex;align-items:center;gap:6px;margin-top:7px;background:#1FA855;color:#fff;font-weight:700;font-size:12px;padding:6px 10px;border-radius:8px}
.demo-acc{display:flex;flex-wrap:wrap;gap:6px}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0}
.thumb.ph{font-size:28px}
.lnk{font-weight:700;color:var(--pri-text)}
.vf{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--pri-text);background:var(--hijau-soft);border-radius:99px;padding:2px 8px;white-space:nowrap}
.vf.sm{padding:0 5px;margin-right:4px;font-size:11px}
.dark .vf{background:rgba(127,211,164,.16);color:#9FE3BC}
.note.safety{font-size:12.5px;line-height:1.45}
.msgs .note.safety{align-self:center;max-width:520px;text-align:center;margin-bottom:4px}
.deal{background:var(--card);border:1.5px solid color-mix(in srgb,var(--padi) 55%,var(--line));border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)}
.dealwrap{align-self:flex-start;width:min(100%,400px)}
.dealwrap.me{align-self:flex-end}
.sys{align-self:center;text-align:center;font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:6px 12px;max-width:90%}
.sys time{display:block;font-size:11px;opacity:.7}
.dealbar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line);background:var(--padi-soft);flex-wrap:wrap}
.how{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;counter-reset:how}
@media (min-width:760px){.how{grid-template-columns:repeat(4,1fr)}}
.how li{counter-increment:how;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 14px 14px 54px;position:relative;display:flex;flex-direction:column;gap:2px}
.how li::before{content:counter(how);position:absolute;left:14px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--padi);color:#2B1D00;font-weight:800;display:grid;place-items:center;font-family:var(--head)}
.rp{display:flex;gap:8px;align-items:flex-start;padding:11px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);cursor:pointer}
.rp:has(input:checked){border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.rp input{margin-top:3px;accent-color:var(--pri)}
@media (max-width:859px){.hide-m{display:none}}
nav.bottom .badge{font-style:normal}
</style>
</head>

const rp = (n) => "Rp " + Math.round(Number(n) || 0).toLocaleString("id-ID");

const jam = (s) => new Date(s).toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

const plusDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };

  let d = String(phone || "").replace(/\D/g, "");
  if (!d) return "";

  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
};

}

// pesan error Supabase/Postgres -> bahasa yang dimengerti pengguna
function friendly(e) {
  const m = String(e?.message || e || "");
  const map = [
    [/Invalid login credentials/i, "Email atau kata sandi salah"],
    [/User already registered|already been registered/i, "Email sudah terdaftar. Silakan masuk."],
    [/Email not confirmed/i, "Email belum dikonfirmasi. Buka email Anda dan klik tautan konfirmasi."],
    [/Password should be at least/i, "Kata sandi minimal 6 karakter"],
    [/rate limit|too many requests/i, "Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi."],
    [/Failed to fetch|NetworkError|Load failed/i, "Koneksi internet bermasalah. Coba lagi."],
    [/row-level security|permission denied/i, "Anda tidak punya akses untuk aksi ini"],
    [/JWT expired/i, "Sesi habis, silakan masuk lagi"],
    [/violates check constraint/i, "Ada isian yang tidak valid, periksa lagi"],
    [/Payload too large|exceeded the maximum allowed size/i, "Ukuran foto terlalu besar"],
  ];
  for (const [re, txt] of map) if (re.test(m)) return txt;
  // pesan dari fungsi database kita sudah berbahasa Indonesia
  if (/^[A-Z][a-z]/.test(m) && !/[a-z]+_[a-z]+|relation|column|function|syntax/i.test(m)) return m;
  console.error(e);
  return "Terjadi kesalahan, coba lagi";
}
async function q(promise) {
  const { data, error } = await promise;
  if (error) throw new UserErr(friendly(error));
  return data;
}

/* ============ foto ============ */
function shrinkToBlob(file, max = 900) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? res(b) : rej()), "image/jpeg", 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
async function uploadPhoto(file) {
  const blob = await shrinkToBlob(file);
  if (blob.size > 2 * 1024 * 1024) throw new UserErr("Foto terlalu besar, coba foto lain");
  const path = `${ME.id}/${rid()}.jpg`;
  await q(sb.storage.from("foto").upload(path, blob, { contentType: "image/jpeg", upsert: false }));
  return sb.storage.from("foto").getPublicUrl(path).data.publicUrl;
}

function chartSVG(hist) {
  if (hist.length < 2) return `<p class="small muted" style="padding:30px 0;text-align:center">Grafik muncul setelah ada harga minimal 2 hari.</p>`;
  const W = 640, H = 260, P = { l: 64, r: 14, t: 14, b: 28 };
  const ps = hist.map((h) => Number(h.price)), min = Math.min(...ps), max = Math.max(...ps), span = max - min || 1;
  const x = (i) => P.l + (i * (W - P.l - P.r)) / Math.max(1, hist.length - 1), y = (v) => P.t + (1 - (v - min) / span) * (H - P.t - P.b);
  const pts = hist.map((h, i) => `${x(i).toFixed(1)},${y(h.price).toFixed(1)}`).join(" ");
  const ticks = [min, min + span / 2, max].map((v) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`).join("");
  const labels = hist.map((h, i) => (i % Math.ceil(hist.length / 7) === 0 || i === hist.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${h.d.slice(8)}/${h.d.slice(5, 7)}</text>` : "")).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik harga">${ticks}${labels}
    <polygon points="${P.l},${H - P.b} ${pts} ${x(hist.length - 1)},${H - P.b}" fill="var(--pri)" opacity=".1"/>
    <polyline points="${pts}" fill="none" stroke="var(--pri-text)" stroke-width="3" stroke-linejoin="round"/>
    ${hist.map((h, i) => `<circle cx="${x(i)}" cy="${y(h.price)}" r="3.5" fill="var(--padi)"><title>${tgl(h.d)}: ${rp(h.price)}</title></circle>`).join("")}</svg>`;
}

let busy = false;
async function act(fn, okMsg, opts = {}) {
  if (busy) return null;
  busy = true; document.body.style.cursor = "progress";
  try {
    const r = await fn();
    if (okMsg) toast(okMsg);
    if (opts.render !== false) await render({ soft: true });
    return r ?? true; // sukses tanpa data (insert/update) tetap dianggap berhasil
  } catch (e) {
    toast(e instanceof UserErr ? e.message : friendly(e), "err");
    return null;
  } finally { busy = false; document.body.style.cursor = ""; }
}

  },
  star(v, el) { const box = el.parentElement; box.dataset.rating = v; box.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i < +v)); },
  editProd(id) { openDlg(id ? "Ubah produk" : "Tambah produk", prodForm(id ? MYPRODS.find((p) => p.id === id) : null)); },
  async delProd(id) { if (confirm("Hapus produk ini dari toko?")) await act(() => q(sb.from("products").delete().eq("id", id)), "Produk dihapus"); },
  async admDelProd(id) { if (confirm("Hapus produk ini karena melanggar aturan? Penjual akan diberi tahu.")) { const ok = await act(() => rpc("admin_delete_product", { p_product: id }), "Produk dihapus", { render: false }); if (ok) go("#/produk"); } },
  newHarvest() {
    if (!ME) return loginFirst();
    if (!isSeller(ME)) { toast("Buka toko dulu lewat Mulai jualan, baru bisa pasang panen", "err"); return go("#/jualan"); }
    openDlg("Pasang panen untuk dilelang", harvestForm());
  },
  async decide(v) {
    const [id, ok] = v.split("|");
    if (ok === "1" && !confirm("Terima tawaran ini? Lelang ditutup, tawaran lain ditolak, dan kartu kesepakatan dikirim ke chat penawar.")) return;
    const cid = await act(() => rpc("decide_offer", { p_offer: id, p_accept: ok === "1" }), ok === "1" ? "Tawaran diterima, kartu kesepakatan terkirim" : "Tawaran ditolak", { render: ok !== "1" });
    if (cid && typeof cid === "string") go("#/chat/" + cid);
  },
  async verify(v) { const [id, val] = v.split("|"); await act(async () => { await rpc("admin_verify", { p_user: id, p_val: val === "1" }); PROF.delete(id); }, val === "1" ? "Toko diverifikasi" : "Verifikasi dicabut"); },
  async delCom(id) { if (confirm("Hapus komoditas ini beserta riwayat harganya?")) { const ok = await act(() => rpc("admin_delete_commodity", { p_commodity: id }), "Komoditas dihapus", { render: false }); if (ok) go("#/harga"); } },
  mapf(v) { mapFilter = v; render({ soft: true }); },
  focus(v) { const [la, ln] = v.split(",").map(Number); window._bigmap?.flyTo([la, ln], 13, { duration: 0.7 }); $("#bigmap")?.scrollIntoView({ behavior: "smooth", block: "center" }); },
  locate() {
    if (!navigator.geolocation) return toast("Perangkat tidak mendukung GPS", "err");
    navigator.geolocation.getCurrentPosition((p) => { myPos = [p.coords.latitude, p.coords.longitude]; render({ soft: true }); toast("Lokasi Anda ditemukan"); },
      () => toast("Izin lokasi ditolak. Jarak dihitung dari pusat Kota Palu.", "err"));
  },
  async forgot() {
    const email = prompt("Masukkan email akun Anda. Tautan untuk membuat kata sandi baru akan dikirim ke email itu.");
    if (!email) return;
    await act(() => q(sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.origin + location.pathname + "#/akun" })), "Cek email Anda untuk tautan ganti kata sandi", { render: false });
  },
};

/* ============ form ============ */
const val = (fd, k) => String(fd.get(k) ?? "").trim();
const F = {
  search(fd) { const s = val(fd, "q"); go("#/produk" + (s ? "?q=" + encodeURIComponent(s) : "")); },
  async login(fd, f) {
    const ok = await act(() => q(sb.auth.signInWithPassword({ email: val(fd, "email").toLowerCase(), password: String(fd.get("pass")) })), "", { render: false });
    if (ok) { await refreshMe(); toast(`Selamat datang, ${ME?.name || ""}!`); go("#" + safeNext(f.dataset.v)); }
  },
  async register(fd, f) {
    const name = val(fd, "name");
    if (name.length < 2) return toast("Nama minimal 2 huruf", "err");
    const res = await act(() => q(sb.auth.signUp({ email: val(fd, "email").toLowerCase(), password: String(fd.get("pass")), options: { data: { name, phone: val(fd, "phone"), city: val(fd, "city") } } })), "", { render: false });
    if (!res) return;
    if (!res.session) { $("main").innerHTML = `<div class="wrap section" style="max-width:480px">${empty("Cek email Anda", "Kami mengirim tautan konfirmasi. Klik tautannya, lalu kembali ke sini dan masuk.")}</div>`; return; }
    await refreshMe(); toast(`Akun dibuat. Selamat datang, ${name}!`); go("#" + safeNext(f.dataset.v));
  },
  async startSell(fd) {
    const ok = await act(async () => { await rpc("become_seller", { p_type: fd.get("type"), p_store: val(fd, "store"), p_phone: val(fd, "phone"), p_city: val(fd, "city") }); await refreshMe(); }, "Toko dibuka! Tambahkan produk pertama Anda", { render: false });
    if (ok) { go("#/jualan"); setTimeout(() => A.editProd(""), 400); }
  },
  async prod(fd, f) {
    const id = f.dataset.v;
    const v = { name: val(fd, "name"), cat: fd.get("cat"), price: digits(fd.get("price")), unit: val(fd, "unit"), stock: digits(fd.get("stock")), min_order: Math.max(1, digits(fd.get("min"))), grade: val(fd, "grade"), descr: val(fd, "descr"), img: val(fd, "img") };
    if (v.name.length < 2) return toast("Isi nama produk", "err");
    if (v.price <= 0) return toast("Harga wajib diisi", "err");
    if (!v.unit) return toast("Satuan wajib diisi", "err");
    if ($("#upimg")?.dataset.busy) return toast("Tunggu foto selesai diunggah", "err");
    const ok = await act(() => (id ? q(sb.from("products").update(v).eq("id", id)) : q(sb.from("products").insert({ ...v, seller: ME.id }))), "Produk tersimpan");
    if (ok) closeDlg();
  },
  async deal(fd, f) {
    const pid = val(fd, "pid");
    const ok = await act(() => rpc("create_deal", { p_conv: f.dataset.v, p_product: pid || null, p_name: val(fd, "name"), p_unit: val(fd, "unit"), p_qty: digits(fd.get("qty")), p_price: digits(fd.get("price")), p_method: fd.get("method"), p_note: val(fd, "note"), p_harvest: null }), "Kartu kesepakatan terkirim");
    if (ok) closeDlg();
  },
  async harvest(fd) {
    const id = await act(() => rpc("create_harvest", { p_commodity: val(fd, "commodity"), p_qty: digits(fd.get("qty")), p_min: digits(fd.get("min")), p_grade: val(fd, "grade"), p_location: val(fd, "location"), p_hdate: fd.get("hdate") || null, p_deadline: fd.get("deadline") || null, p_descr: val(fd, "descr") }), "Lelang panen dibuka", { render: false });
    if (id) { closeDlg(); go("#/lelang/" + id); }
  },
  async offer(fd, f) {
    const [hid, maxq] = f.dataset.v.split("|");
    await act(() => rpc("make_offer", { p_harvest: hid, p_price: digits(fd.get("price")), p_qty: digits(fd.get("qty")) || +maxq, p_note: val(fd, "note") }), "Penawaran terkirim ke petani");
  },
  async review(fd, f) { await act(() => rpc("add_review", { p_deal: f.dataset.v, p_rating: +$(".starpick", f).dataset.rating, p_comment: val(fd, "c") }), "Terima kasih atas ulasannya!"); },
  async msg(fd, f) {
    const show = $("#offerIn").style.display !== "none", offer = show ? digits(fd.get("offer")) : 0, text = val(fd, "t");
    if (!text && !offer) return;
    const input = $('.composer input[name="t"]'); if (input) input.value = "";
    const ok = await act(() => rpc("send_message", { p_conv: f.dataset.v, p_body: text, p_offer: offer || null }));
    if (!ok && input) input.value = text; // kembalikan teks bila gagal terkirim
    $('.composer input[name="t"]')?.focus();
  },
  async price(fd, f) { await act(() => rpc("admin_set_price", { p_commodity: f.dataset.v, p_price: digits(fd.get("p")) }), "Harga diperbarui"); },
  async addCom(fd) { await act(() => rpc("admin_add_commodity", { p_name: val(fd, "name"), p_unit: val(fd, "unit"), p_price: digits(fd.get("price")) }), "Komoditas ditambahkan"); },
  async profile(fd) {
    const name = val(fd, "name");
    if (name.length < 2) return toast("Nama minimal 2 huruf", "err");
    await act(async () => {
      const patch = { name, phone: val(fd, "phone"), city: val(fd, "city"), address: val(fd, "address") };
      if (ME.seller_type) { patch.lat = acctDraft.lat ?? null; patch.lng = acctDraft.lng ?? null; }
      await q(sb.from("profiles").update(patch).eq("id", ME.id));
      if (ME.seller_type) {
        const store = val(fd, "store"), type = fd.get("type");
        if (store !== ME.store || type !== ME.seller_type) await rpc("become_seller", { p_type: type, p_store: store, p_phone: patch.phone, p_city: patch.city });
      }
      PROF.delete(ME.id); await refreshMe();
    }, "Profil tersimpan");
  },
};

/* ============ event ============ */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-a]");
  if (t && A[t.dataset.a]) { e.preventDefault(); A[t.dataset.a](t.dataset.v ?? "", t, e); return; }
  document.querySelectorAll("details.pop[open]").forEach((d) => { if (!d.contains(e.target) || e.target.closest("a")) d.open = false; });
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-f]");
  if (!f || !F[f.dataset.f]) return;
  e.preventDefault();
  if (f.dataset.f === "startSell" && !f.agree.checked) return toast("Centang persetujuan aturan jualan dulu", "err");
  F[f.dataset.f](new FormData(f), f);
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset?.dealpid) {
    $("#manualItem").style.display = t.value ? "none" : "grid";
    if (t.value) t.form.price.value = t.selectedOptions[0].dataset.price;
    return;
  }
  if (t.dataset?.up) {
    const file = t.files?.[0]; t.value = "";
    if (!file) return;
    const form = t.closest("form"), msg = $("#upmsg");
    t.dataset.busy = "1"; if (msg) msg.textContent = "Mengunggah foto…";
    try {
      const url = await uploadPhoto(file);
      form.querySelector('[name="img"]').value = url;
      form.querySelector(".prev").innerHTML = `<img src="${esc(url)}" alt="">`;
      if (msg) msg.textContent = "Foto siap. Tekan Simpan produk.";
    } catch (err) { toast(err instanceof UserErr ? err.message : "Foto gagal diunggah, coba lagi", "err"); if (msg) msg.textContent = "Ketuk kotak untuk pilih foto."; }
    finally { delete t.dataset.busy; }
  }
});
document.addEventListener("toggle", async (e) => {
  if (e.target.id === "bell" && !e.target.open && NOTIFS.some((n) => !n.read)) {
    try { await rpc("mark_notifs_read"); NOTIFS.forEach((n) => (n.read = true)); render({ soft: true }); } catch { /* biarkan */ }
  }
}, true);
$("#dlg").addEventListener("click", (e) => { if (e.target.id === "dlg") closeDlg(); });
window.addEventListener("hashchange", () => render());

/* ============ realtime: chat & notifikasi langsung muncul ============ */
let channel = null, rtTimer = null;
function setupRealtime() {
  if (channel) { sb.removeChannel(channel); channel = null; }
  if (!ME) return;
  const bump = (why, row) => {
    clearTimeout(rtTimer);
    rtTimer = setTimeout(() => {
      const r = route();
      const onChat = r.parts[0] === "chat";
      const onDeals = r.parts[0] === "transaksi";
      if ((onChat && (!r.parts[1] || row?.conv === r.parts[1] || why === "conv")) || (onDeals && why === "deal")) render({ soft: true });
      else refreshCounters().then(() => { const h = $("header.top"), nb = $("nav.bottom"); if (h) h.outerHTML = header(r); if (nb) nb.outerHTML = bottomNav(r); }).catch(() => {});
    }, 350);
  };
  channel = sb.channel("ptc-" + ME.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (p) => bump("msg", p.new))
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "deals" }, (p) => bump("deal", p.new))
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: `uid=eq.${ME.id}` }, () => bump("notif"))
    .subscribe();
}

/* ============ mulai ============ */
(async function start() {
  if (!sb) { $("#app").innerHTML = pSetup(); return; }
  try { await refreshMe(); } catch (e) { console.error(e); }
  setupRealtime();
  sb.auth.onAuthStateChange((ev) => {
    // jangan memanggil Supabase langsung di dalam callback ini (bisa macet); tunda sebentar
    if (ev === "SIGNED_IN" || ev === "SIGNED_OUT" || ev === "TOKEN_REFRESHED" || ev === "USER_UPDATED")
      setTimeout(async () => { const before = ME?.id; await refreshMe().catch(() => {}); if (before !== ME?.id) { setupRealtime(); render(); } }, 0);
    if (ev === "PASSWORD_RECOVERY") setTimeout(async () => {
      const p = prompt("Masukkan kata sandi baru (minimal 6 karakter)");
      if (p) await act(() => q(sb.auth.updateUser({ password: p })), "Kata sandi diganti", { render: false });
    }, 0);
  });
  render();
})();

</script>
